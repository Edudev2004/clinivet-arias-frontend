<!-- Contenedor principal con la imagen -->
<div class="min-h-screen flex items-center justify-center bg-[url('/assets/img/fondo-login.jpg')] bg-cover bg-center bg-no-repeat px-4 relative">
  
  <!-- Capa superpuesta que oscurece (60%) y difumina (blur) el fondo -->
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

  <!-- Contenedor del formulario (z-10 para que quede por encima del fondo difuminado) -->
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 space-y-6 relative z-10">
    
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold text-slate-800">Clinivet Arias</h1>
      <p class="text-sm text-slate-500">Ingresa tus credenciales para acceder al sistema</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Correo -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input 
          type="email" 
          formControlName="email"
          placeholder="admin@clinivet.pe"
          class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none transition text-slate-800"
          [ngClass]="{'border-rose-500': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}"
        />
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="text-xs text-rose-500 mt-1 block">
          El correo es obligatorio.
        </span>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <div class="relative">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password"
            placeholder="••••••••"
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none transition text-slate-800 pr-10"
            [ngClass]="{'border-rose-500': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
          />
          <button 
            type="button" 
            (click)="toggleShowPassword()" 
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 focus:outline-none"
          >
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.962 8.962 0 012.122-.363c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage()" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-sm flex items-center gap-2">
        <span>⚠️</span>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Botón -->
      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full bg-sky-600 hover:bg-sky-700 disabled:bg-sky-300 text-white font-medium py-2 px-4 rounded-lg transition duration-200 shadow-md flex items-center justify-center gap-2"
      >
        <span *ngIf="isLoading()" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
        <span>{{ isLoading() ? 'Iniciando sesión...' : 'Ingresar' }}</span>
      </button>
    </form>
  </div>
</div>
