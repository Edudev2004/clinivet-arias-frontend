<div class="min-h-screen flex items-center justify-center bg-[url('/assets/img/fondo-login.jpg')] bg-cover bg-center bg-no-repeat px-4 relative">
  
  <!-- 1. Fondo: Mayor opacidad azulada (slate-900/75) y desenfoque incrementado (backdrop-blur-md) -->
  <div class="absolute inset-0 bg-slate-900/75 backdrop-blur-md"></div>

  <!-- 2. Contenedor: rounded-2xl y shadow-2xl para profundidad moderna -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-7 relative z-10">
    
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Clinivet Arias</h1>
      <p class="text-sm text-slate-500 font-medium">Ingresa tus credenciales para acceder</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <!-- 3 y 4. Correo electrónico con ícono y validación de label -->
      <div class="space-y-1.5">
        <label 
          class="block text-sm font-semibold transition-colors duration-200"
          [ngClass]="{'text-rose-500': loginForm.get('email')?.touched && loginForm.get('email')?.invalid, 'text-slate-700': !(loginForm.get('email')?.touched && loginForm.get('email')?.invalid)}"
        >
          Correo electrónico
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
            </svg>
          </div>
          <input 
            type="email" 
            formControlName="email"
            placeholder="admin@clinivet.pe"
            class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-800 bg-slate-50/50 focus:bg-white"
            [ngClass]="{'border-rose-500 focus:ring-rose-500 focus:border-rose-500': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}"
          />
        </div>
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="text-xs font-medium text-rose-500 block">
          El correo es obligatorio.
        </span>
      </div>

      <!-- 3 y 4. Contraseña con íconos y validación de label -->
      <div class="space-y-1.5">
        <label 
          class="block text-sm font-semibold transition-colors duration-200"
          [ngClass]="{'text-rose-500': loginForm.get('password')?.touched && loginForm.get('password')?.invalid, 'text-slate-700': !(loginForm.get('password')?.touched && loginForm.get('password')?.invalid)}"
        >
          Contraseña
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
            </svg>
          </div>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password"
            placeholder="••••••••"
            class="w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-800 bg-slate-50/50 focus:bg-white"
            [ngClass]="{'border-rose-500 focus:ring-rose-500 focus:border-rose-500': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
          />
          <button 
            type="button" 
            (click)="toggleShowPassword()" 
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
          >
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.962 8.962 0 012.122-.363c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- 6. Recordarme y Olvidé contraseña -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer group">
          <input type="checkbox" formControlName="rememberMe" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
          <span class="text-slate-600 font-medium group-hover:text-slate-800 transition-colors">Recordarme</span>
        </label>
        <a href="#" class="text-blue-600 font-semibold hover:text-blue-700 transition-colors">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Error Global -->
      <div *ngIf="errorMessage()" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-sm font-medium flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- 5. Botón: Gradiente, hover effect y shadow -->
      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-700 hover:to-sky-600 disabled:opacity-70 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2 mt-2"
      >
        <svg *ngIf="isLoading()" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ isLoading() ? 'Iniciando sesión...' : 'Ingresar al sistema' }}</span>
      </button>
    </form>
  </div>
</div>
