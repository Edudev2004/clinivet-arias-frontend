<div class="min-h-screen flex items-center justify-center bg-[url('/assets/img/fondo-login.jpg')] bg-cover bg-center bg-no-repeat px-4 relative">
  
  <!-- 1. Fondo: Mayor opacidad azulada (slate-900/75) y desenfoque incrementado (backdrop-blur-md) -->
  <div class="absolute inset-0 bg-slate-900/75 backdrop-blur-md"></div>

  <!-- 2. Contenedor: rounded-2xl y shadow-2xl para profundidad moderna -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-7 sm:p-8 space-y-6 relative z-10 animate-in fade-in zoom-in-95 duration-200 border border-slate-100">
    
    <div class="text-center space-y-2">
      <!-- Logotipo Oficial Clinivet Arias -->
      <div class="flex justify-center mb-2">
        <img
          src="assets/img/logo-vertical.png"
          alt="Clinivet Arias — Centro Veterinario"
          class="h-24 sm:h-28 object-contain transition-transform hover:scale-105 duration-300 drop-shadow-sm"
        />
      </div>
      <p class="text-xs sm:text-sm text-slate-500 font-medium">Ingresa tus credenciales para acceder al sistema</p>
    </div>

    <!-- ⚡ Accesos de prueba rápida (1-click) estilo VetHD -->
    <div class="p-3.5 rounded-2xl bg-slate-50/90 border border-slate-200/80 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">
          ⚡ Accesos Rápidos (1-Click)
        </span>
        <span class="text-[10px] font-semibold text-brand-700 bg-brand-100/70 px-2 py-0.5 rounded-full">
          Demo
        </span>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <!-- Botón Admin -->
        <button
          type="button"
          (click)="handleQuickFill('admin@clinivet.pe')"
          class="p-2 rounded-xl bg-white hover:bg-amber-50 border border-slate-200 hover:border-amber-300 text-left transition-all shadow-2xs group focus:outline-none"
          title="Autocompletar como Administrador"
        >
          <div class="flex items-center gap-1.5 text-amber-700 text-xs font-bold">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
            </svg>
            <span class="truncate">Admin</span>
          </div>
          <p class="text-[10px] text-slate-400 mt-0.5 truncate">Rommel</p>
        </button>

        <!-- Botón Veterinario -->
        <button
          type="button"
          (click)="handleQuickFill('veterinario@clinivet.pe')"
          class="p-2 rounded-xl bg-white hover:bg-brand-50 border border-slate-200 hover:border-brand-300 text-left transition-all shadow-2xs group focus:outline-none"
          title="Autocompletar como Médico Veterinario"
        >
          <div class="flex items-center gap-1.5 text-brand-600 text-xs font-bold">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 4.5v3a7.5 7.5 0 0015 0v-3m-15 0h3m12 0h-3m-7.5 7.5v3.75a3.75 3.75 0 007.5 0v-1.5m0 0a1.5 1.5 0 10-3 0 1.5 1.5 0 003 0z"/>
            </svg>
            <span class="truncate">Veterinario</span>
          </div>
          <p class="text-[10px] text-slate-400 mt-0.5 truncate">Beckhan</p>
        </button>

        <!-- Botón Recepcionista -->
        <button
          type="button"
          (click)="handleQuickFill('recepcion@clinivet.pe')"
          class="p-2 rounded-xl bg-white hover:bg-sky-50 border border-slate-200 hover:border-sky-300 text-left transition-all shadow-2xs group focus:outline-none"
          title="Autocompletar como Recepcionista"
        >
          <div class="flex items-center gap-1.5 text-sky-700 text-xs font-bold">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
            </svg>
            <span class="truncate">Recepción</span>
          </div>
          <p class="text-[10px] text-slate-400 mt-0.5 truncate">Lucero</p>
        </button>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- Correo electrónico con ícono y validación -->
      <div class="space-y-1.5">
        <label 
          class="block text-xs font-bold uppercase tracking-wider transition-colors duration-200"
          [ngClass]="{'text-rose-500': loginForm.get('email')?.touched && loginForm.get('email')?.invalid, 'text-slate-700': !(loginForm.get('email')?.touched && loginForm.get('email')?.invalid)}"
        >
          Correo electrónico
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
            </svg>
          </div>
          <input 
            type="email" 
            formControlName="email"
            placeholder="admin@clinivet.pe"
            class="w-full pl-10 pr-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all text-xs sm:text-sm text-slate-800 bg-slate-50/50 focus:bg-white shadow-xs"
            [ngClass]="{'border-rose-500 focus:ring-rose-500 focus:border-rose-500': loginForm.get('email')?.touched && loginForm.get('email')?.invalid, 'border-slate-200': !loginForm.get('email')?.touched || loginForm.get('email')?.valid}"
          />
        </div>
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="text-xs font-medium text-rose-500 block">
          El correo es obligatorio.
        </span>
      </div>

      <!-- Contraseña con íconos y validación -->
      <div class="space-y-1.5">
        <label 
          class="block text-xs font-bold uppercase tracking-wider transition-colors duration-200"
          [ngClass]="{'text-rose-500': loginForm.get('password')?.touched && loginForm.get('password')?.invalid, 'text-slate-700': !(loginForm.get('password')?.touched && loginForm.get('password')?.invalid)}"
        >
          Contraseña
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
            </svg>
          </div>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password"
            placeholder="••••••••"
            class="w-full pl-10 pr-10 py-2.5 border rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all text-xs sm:text-sm text-slate-800 bg-slate-50/50 focus:bg-white shadow-xs"
            [ngClass]="{'border-rose-500 focus:ring-rose-500 focus:border-rose-500': loginForm.get('password')?.touched && loginForm.get('password')?.invalid, 'border-slate-200': !loginForm.get('password')?.touched || loginForm.get('password')?.valid}"
          />
          <button 
            type="button" 
            (click)="toggleShowPassword()" 
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
          >
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.962 8.962 0 012.122-.363c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Recordarme y Olvidé contraseña -->
      <div class="flex items-center justify-between text-xs sm:text-sm">
        <label class="flex items-center gap-2 cursor-pointer group">
          <input type="checkbox" formControlName="rememberMe" class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 cursor-pointer">
          <span class="text-slate-600 font-medium group-hover:text-slate-800 transition-colors">Recordarme</span>
        </label>
        <a href="#" class="text-brand-600 font-semibold hover:text-brand-700 transition-colors">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Error Global -->
      <div *ngIf="errorMessage()" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-medium flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Botón de Ingreso con Paleta Institucional -->
      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 text-white font-bold text-xs sm:text-sm py-3 px-4 rounded-xl transition-all duration-200 shadow-md shadow-brand-700/20 flex items-center justify-center gap-2 active:scale-95 cursor-pointer mt-2"
      >
        <svg *ngIf="isLoading()" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ isLoading() ? 'Iniciando sesión...' : 'Ingresar al sistema' }}</span>
      </button>
    </form>
  </div>
</div>
